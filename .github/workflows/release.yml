name: Source release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish source and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main for the release ancestry gate
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate version and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "$RELEASE_TAG" --check-main --github-output "$GITHUB_OUTPUT"

      - name: Publish GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "Hoard ${RELEASE_TAG}")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"
