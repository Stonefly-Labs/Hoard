name: Conformance foundations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-foundations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundations:
    name: Native ownership and evidence regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run non-qualifying foundational regressions
        run: python3 scripts/conformance_unit_checks.py
      - name: Verify source-owned catalogs
        run: |
          python3 tests/fixtures/conformance/baselines/freeze_inventory.py --check
          python3 scripts/conformance_case_catalog.py --check-sdk

  sdk-diagnostics:
    name: Non-qualifying Linux SDK and safe logger diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the global.json compatible .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.203
          global-json-file: global.json
      - name: Seal six baselines before candidate SDK and logger diagnostics
        shell: bash
        run: |
          set -euo pipefail
          private_parent="../sdk-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private_parent"
          python3 scripts/conformance_sdk_checks.py \
            --root "$GITHUB_WORKSPACE" --evidence "$private_parent/run"
