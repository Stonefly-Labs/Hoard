name: Conformance composition diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-composition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  composition-diagnostics:
    name: Non-qualifying native packaged composition observations
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the global.json compatible .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.203
          global-json-file: global.json
      - name: Admit selected exact-child observations and release process resources
        shell: bash
        run: |
          set -euo pipefail
          private_parent="$(dirname "$GITHUB_WORKSPACE")/composition-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private_parent"
          status=0
          bash scripts/validate-conformance.sh \
            --profile composition --evidence "$private_parent/run" || status=$?
          test "$status" -eq 2
          python3 - "$private_parent/run" "$GITHUB_SHA" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import conformance_evidence as evidence
          from conformance_inherited import BASELINE, CONTROLLER_BASELINES, verify_controller_tooling
          from conformance_sources import read_bounded
          root = Path(sys.argv[1])
          summary = evidence.load_json(read_bounded(root / "proofs/composition-diagnostic-summary.json", 65536))
          inputs = evidence.admit_entity("RunInputs", evidence.load_json(read_bounded(
              root / "proofs/composition-inputs.json", 2 * 1024**2)))
          owner = evidence.load_json(read_bounded(root / "runtime-owner.json", 65536))
          baseline_raw = read_bounded(root / CONTROLLER_BASELINES, 16 * 1024**2)
          baseline = evidence.load_json(baseline_raw)
          inherited = summary["inheritedRuntime"]
          mutations = inherited["discoveryMutations"]
          scenarios = inherited["discoveryScenarios"]
          try:
              verify_controller_tooling(root, inherited["tooling"], inputs, owner)
          except evidence.ConformanceError:
              raise SystemExit("WitnessMissing") from None
          if (summary["qualification"] is not False or summary["profileComplete"] is not False
                  or summary["passedComponents"] != 36 or summary["admittedSnapshots"] != 110
                  or summary["processResourcesReleased"] is not True
                  or inputs["sourceRevision"] != sys.argv[2] or inputs["sourceState"] != "clean-ci"
                  or inputs["mode"] != "diagnostic" or inputs["profileId"] != "composition"
                  or summary["inputSha256"] != evidence.digest(inputs)
                  or owner["runId"] != inputs["runId"]
                  or baseline["runId"] != inputs["runId"] or baseline["rootId"] != owner["rootId"]
                  or baseline["qualification"] is not False or baseline["nativeContainment"] is not False
                  or baseline["mode"] != "preparation" or baseline["baselineRevision"] != BASELINE
                  or hashlib.sha256(baseline_raw).hexdigest() != inherited["historicalBaselineSealSha256"]
                  or inherited["qualification"] is not False or inherited["profileComplete"] is not False
                  or inherited["executionComplete"] is not True or inherited["nativeContainment"] is not True
                  or inherited["controllerNativeContainment"] is not False
                  or inherited["fullControllerAcceptance"] is not False
                  or inherited["historicalBinariesPreparedBeforeCandidate"] is not True
                  or mutations["qualification"] is not False or mutations["mutations"] != 12
                  or mutations["negativeParameters"] != 29 or mutations["repairedParameters"] != 29
                  or scenarios["qualification"] is not False or scenarios["parameters"] != 137
                  or scenarios["adapterScenarios"] != 4 or scenarios["suites"] != 10
                  or inherited["passedParameters"] != 525 or inherited["scopes"] != 58
                  or len(inherited["commands"]) != 58):
              raise SystemExit("WitnessMissing")
          print('{"qualification":false,"status":"Incomplete","code":"EvidenceIncomplete"}')
          PY
